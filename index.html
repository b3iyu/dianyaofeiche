<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电摇飞车 - 官方网站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 样式（与之前完全相同，此处省略节省篇幅，您可沿用之前的样式） ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei",sans-serif; }
        body { background:linear-gradient(135deg,#1a1a2e,#16213e); color:#fff; min-height:100vh; }
        /* ... 全部样式代码复制您之前的即可，此处不重复写，避免过长 */
        /* 为了完整性，这里提供一个极简样式，实际使用请替换为完整样式 */
        header { background:rgba(0,0,0,0.6); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
        .logo { display:flex; align-items:center; gap:10px; font-size:28px; font-weight:bold; color:#ffcc00; }
        /* ... 其他样式略，您可以直接使用之前完整的样式代码 */
    </style>
</head>
<body>
    <!-- HTML 结构保持不变（与之前完全一致） -->
    <!-- 为节省篇幅，这里省略具体HTML，但您的页面结构需要保留，只改动JavaScript -->

    <script>
        // ============================================================
        // 1. Supabase 配置（请替换成你自己的）
        // ============================================================
        const SUPABASE_URL = "https://tdozxaazdiuauncmhvuo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Pstnb3KOIrdvXtwKiT3rPg_X7-9TL1U";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ---------- 全局状态 ----------
        let currentTicketType = "";
        let currentUsername = "";
        let currentRole = "user";
        let toastTimer = null;

        // ---------- Toast 提示 ----------
        function showToast(msg, type = 'info', duration = 3000) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.className = 'toast show';
            if (type === 'success') el.classList.add('success');
            if (type === 'error') el.classList.add('error');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.classList.remove('show'); }, duration);
        }

        // ---------- SHA-256 ----------
        async function sha256(message) {
            if (!window.crypto || !window.crypto.subtle) {
                throw new Error('当前浏览器不支持加密，请使用 HTTPS 或 localhost 访问');
            }
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ---------- 页面加载 ----------
        window.onload = async function() {
            try {
                if (!window.isSecureContext) {
                    showToast('⚠️ 当前页面非安全环境（HTTPS），加密功能不可用', 'error', 5000);
                }
                await checkSession();
                await renderHomeNotice();
            } catch (e) {
                console.error('初始化错误:', e);
                showToast('页面初始化失败: ' + e.message, 'error');
            }
        };

        // ---------- 会话检查 ----------
        async function checkSession() {
            const raw = localStorage.getItem("dyfc_user");
            if (!raw) return;
            try {
                const userObj = JSON.parse(raw);
                currentUsername = userObj.username || '';
                currentRole = userObj.role || 'user';
                hideAll();
                if (currentRole === "admin") {
                    document.getElementById("adminPage").style.display = "block";
                } else {
                    document.getElementById("userPage").style.display = "block";
                    await renderUserNotice();
                }
            } catch (e) {
                localStorage.removeItem("dyfc_user");
            }
        }

        // ---------- 页面切换 ----------
        function hideAll() {
            const ids = [
                'home', 'login', 'register', 'userPage', 'stationPage',
                'ticketPage', 'buyPage', 'orderSuccess', 'myOrderPage',
                'adminPage', 'orderListPage', 'noticeManagePage'
            ];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            document.getElementById('loginError').innerText = '';
            document.getElementById('regError').innerText = '';
        }

        function showHome() { hideAll(); document.getElementById('home').style.display = 'block'; renderHomeNotice(); }
        function showLogin() { hideAll(); document.getElementById('login').style.display = 'block'; }
        function showRegister() { hideAll(); document.getElementById('register').style.display = 'block'; }

        // ============================================================
        // 2. 公告渲染 - 将 created_at 改为 create_at
        // ============================================================

        async function renderHomeNotice() {
            const box = document.getElementById('homeNoticeList');
            box.innerHTML = '<div class="notice-item" style="color:#aaa;">加载中...</div>';
            try {
                const { data, error } = await supabaseClient
                    .from('dyfc_notices')
                    .select('*')
                    .order('create_at', { ascending: false });  // ← 改这里

                if (error) {
                    console.error('[首页公告] 查询失败:', error);
                    box.innerHTML = `<div class="notice-error">⚠️ 公告加载失败：${error.message}</div>`;
                    return;
                }
                if (!data || data.length === 0) {
                    box.innerHTML = '<div class="notice-empty">暂无公告</div>';
                    return;
                }
                box.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'notice-item';
                    const time = item.create_at ? new Date(item.create_at).toLocaleString() : ''; // ← 改这里
                    div.innerText = `• ${item.content}` + (time ? `  （${time}）` : '');
                    box.appendChild(div);
                });
            } catch (err) {
                console.error('[首页公告] 异常:', err);
                box.innerHTML = `<div class="notice-error">⚠️ 公告加载异常：${err.message}</div>`;
            }
        }

        async function renderUserNotice() {
            const box = document.getElementById('userNoticeList');
            box.innerHTML = '<div class="notice-item" style="color:#aaa;">加载中...</div>';
            try {
                const { data, error } = await supabaseClient
                    .from('dyfc_notices')
                    .select('*')
                    .order('create_at', { ascending: false });  // ← 改这里

                if (error) {
                    console.error('[用户公告] 查询失败:', error);
                    box.innerHTML = `<div class="notice-error">⚠️ 公告加载失败：${error.message}</div>`;
                    return;
                }
                if (!data || data.length === 0) {
                    box.innerHTML = '<div class="notice-empty">暂无公告</div>';
                    return;
                }
                box.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'notice-item';
                    const time = item.create_at ? new Date(item.create_at).toLocaleString() : ''; // ← 改这里
                    div.innerText = `• ${item.content}` + (time ? `  （${time}）` : '');
                    box.appendChild(div);
                });
            } catch (err) {
                console.error('[用户公告] 异常:', err);
                box.innerHTML = `<div class="notice-error">⚠️ 公告加载异常：${err.message}</div>`;
            }
        }

        async function renderNoticeManage() {
            const box = document.getElementById('noticeManageList');
            const countEl = document.getElementById('noticeCount');
            box.innerHTML = '<div class="notice-item" style="color:#aaa;">加载中...</div>';
            try {
                const { data, error } = await supabaseClient
                    .from('dyfc_notices')
                    .select('*')
                    .order('create_at', { ascending: false });  // ← 改这里

                if (error) {
                    console.error('[公告管理] 查询失败:', error);
                    box.innerHTML = `<div class="notice-error">⚠️ 公告加载失败：${error.message}</div>`;
                    if (countEl) countEl.textContent = '0';
                    return;
                }
                if (!data || data.length === 0) {
                    box.innerHTML = '<div class="notice-empty">暂无公告，点击上方「发布新公告」添加</div>';
                    if (countEl) countEl.textContent = '0';
                    return;
                }
                if (countEl) countEl.textContent = data.length;
                box.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'notice-item-manage';
                    const time = item.create_at ? new Date(item.create_at).toLocaleString() : ''; // ← 改这里
                    div.innerHTML = `
                        <div class="notice-content"><strong>${item.content}</strong>${time ? `<span style="color:#888;font-size:12px;margin-left:10px;">${time}</span>` : ''}</div>
                        <div class="notice-actions">
                            <button class="btn btn-sm" onclick="editNotice(${item.id}, '${escapeHtml(item.content)}')">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteNotice(${item.id})">删除</button>
                        </div>
                    `;
                    box.appendChild(div);
                });
            } catch (err) {
                console.error('[公告管理] 异常:', err);
                box.innerHTML = `<div class="notice-error">⚠️ 公告加载异常：${err.message}</div>`;
                if (countEl) countEl.textContent = '0';
            }
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ============================================================
        // 3. 公告 CRUD（插入时使用 create_at）
        // ============================================================

        async function addNotice() {
            const inp = document.getElementById('newNoticeContent');
            const content = inp.value.trim();
            if (!content) { showToast('请输入公告内容', 'error'); return; }
            try {
                const { error } = await supabaseClient
                    .from('dyfc_notices')
                    .insert([{ content, create_at: new Date().toISOString() }]); // ← 改这里

                if (error) {
                    console.error('[添加公告] 失败:', error);
                    showToast('发布公告失败：' + error.message, 'error');
                    return;
                }
                inp.value = '';
                showToast('✅ 公告发布成功！', 'success');
                await renderNoticeManage();
                await renderHomeNotice();
                await renderUserNotice();
            } catch (err) {
                console.error('[添加公告] 异常:', err);
                showToast('发布公告异常：' + err.message, 'error');
            }
        }

        async function editNotice(id, oldText) {
            const newVal = prompt('编辑公告内容', oldText);
            if (newVal === null) return;
            const trimmed = newVal.trim();
            if (!trimmed) { showToast('公告内容不能为空', 'error'); return; }
            try {
                const { error } = await supabaseClient
                    .from('dyfc_notices')
                    .update({ content: trimmed })
                    .eq('id', id);

                if (error) {
                    console.error('[编辑公告] 失败:', error);
                    showToast('编辑失败：' + error.message, 'error');
                    return;
                }
                showToast('✅ 公告已更新', 'success');
                await renderNoticeManage();
                await renderHomeNotice();
                await renderUserNotice();
            } catch (err) {
                console.error('[编辑公告] 异常:', err);
                showToast('编辑异常：' + err.message, 'error');
            }
        }

        async function deleteNotice(id) {
            if (!confirm('确定要删除这条公告吗？')) return;
            try {
                const { error } = await supabaseClient
                    .from('dyfc_notices')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('[删除公告] 失败:', error);
                    showToast('删除失败：' + error.message, 'error');
                    return;
                }
                showToast('🗑️ 公告已删除', 'success');
                await renderNoticeManage();
                await renderHomeNotice();
                await renderUserNotice();
            } catch (err) {
                console.error('[删除公告] 异常:', err);
                showToast('删除异常：' + err.message, 'error');
            }
        }

        // ============================================================
        // 4. 用户认证（不受影响，继续使用 supabaseClient）
        // ============================================================

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const pwd = document.getElementById('regPwd').value.trim();
            const errTip = document.getElementById('regError');
            errTip.innerText = '';
            if (!username || !pwd) { errTip.innerText = '用户名、密码不能为空'; return; }
            if (pwd.length < 6) { errTip.innerText = '密码至少6位'; return; }
            try {
                const hashPwd = await sha256(pwd);
                const { error } = await supabaseClient
                    .from('app_users')
                    .insert([{ username, password_hash: hashPwd, role: 'user' }]);

                if (error) {
                    if (error.code === '23505') errTip.innerText = '用户名已存在';
                    else errTip.innerText = error.message;
                    return;
                }
                showToast('🎉 注册成功，请登录', 'success');
                showLogin();
            } catch (err) {
                errTip.innerText = '注册异常：' + err.message;
                console.error('注册错误:', err);
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const pwd = document.getElementById('loginPwd').value;
            const errTip = document.getElementById('loginError');
            errTip.innerText = '';
            if (!username || !pwd) { errTip.innerText = '填写用户名和密码'; return; }
            try {
                const hashPwd = await sha256(pwd);
                const { data, error } = await supabaseClient
                    .from('app_users')
                    .select('username, role')
                    .eq('username', username)
                    .eq('password_hash', hashPwd)
                    .maybeSingle();

                if (error || !data) {
                    errTip.innerText = '用户名或者密码错误';
                    return;
                }
                currentUsername = data.username;
                currentRole = data.role || 'user';
                localStorage.setItem('dyfc_user', JSON.stringify(data));
                hideAll();
                if (currentRole === 'admin') {
                    document.getElementById('adminPage').style.display = 'block';
                    showToast('👑 管理员登录成功', 'success');
                } else {
                    document.getElementById('userPage').style.display = 'block';
                    await renderUserNotice();
                    showToast('🚗 欢迎回来，' + currentUsername, 'success');
                }
            } catch (err) {
                errTip.innerText = '登录异常：' + err.message;
                console.error('登录错误:', err);
            }
        }

        function logout() {
            localStorage.removeItem('dyfc_user');
            currentUsername = '';
            currentRole = 'user';
            showHome();
            showToast('已退出登录', 'info');
        }

        // ============================================================
        // 5. 购票流程 - 订单插入和查询均使用 create_at
        // ============================================================

        function showStationPage() { hideAll(); document.getElementById('userPage').style.display = 'block'; document.getElementById('stationPage').style.display = 'block'; }
        function showTicketPage() { hideAll(); document.getElementById('userPage').style.display = 'block'; document.getElementById('ticketPage').style.display = 'block'; }
        function showBuyPage(ticket) {
            currentTicketType = ticket;
            document.getElementById('selectedTicket').innerText = ticket;
            hideAll();
            document.getElementById('userPage').style.display = 'block';
            document.getElementById('buyPage').style.display = 'block';
        }

        async function submitOrder() {
            const buyerName = document.getElementById('buyerName').value.trim();
            if (!buyerName) { showToast('请填写学号', 'error'); return; }
            const orderNo = 'DYFC' + Date.now().toString().slice(-6) +
                Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            const payload = {
                ticket: currentTicketType,
                name: buyerName,
                station: '公园路小学（东）',
                order_no: orderNo,
                username: currentUsername,
                create_at: new Date().toISOString()  // ← 改这里
            };
            try {
                const { error } = await supabaseClient.from('dyfc_orders').insert([payload]);
                if (error) {
                    showToast('下单失败：' + error.message, 'error');
                    return;
                }
                document.getElementById('orderNo').innerText = orderNo;
                document.getElementById('buyerName').value = '';
                hideAll();
                document.getElementById('userPage').style.display = 'block';
                document.getElementById('orderSuccess').style.display = 'block';
                showToast('✅ 购票成功！', 'success');
            } catch (err) {
                showToast('下单异常：' + err.message, 'error');
            }
        }

        async function showMyOrder() {
            hideAll();
            document.getElementById('userPage').style.display = 'block';
            document.getElementById('myOrderPage').style.display = 'block';
            const tbody = document.getElementById('myOrderBody');
            tbody.innerHTML = '<tr><td colspan="5" class="empty-tip">加载中...</td></tr>';
            try {
                const { data, error } = await supabaseClient
                    .from('dyfc_orders')
                    .select('*')
                    .eq('username', currentUsername)
                    .order('create_at', { ascending: false });  // ← 改这里

                if (error) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-tip">加载失败：${error.message}</td></tr>`;
                    return;
                }
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-tip">暂无购票记录</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(o => {
                    const tr = document.createElement('tr');
                    const time = o.create_at ? new Date(o.create_at).toLocaleString() : '-'; // ← 改这里
                    tr.innerHTML = `
                        <td>${o.ticket || '-'}</td>
                        <td>${o.name || '-'}</td>
                        <td>${o.order_no || '-'}</td>
                        <td>${o.station || '-'}</td>
                        <td>${time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-tip">异常：${err.message}</td></tr>`;
            }
        }

        function backToUser() { hideAll(); document.getElementById('userPage').style.display = 'block'; renderUserNotice(); }

        // ============================================================
        // 6. 管理员功能 - 订单列表也使用 create_at
        // ============================================================

        async function showOrderList() {
            hideAll();
            document.getElementById('adminPage').style.display = 'block';
            document.getElementById('orderListPage').style.display = 'block';
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="empty-tip">加载中...</td></tr>';
            try {
                const { data, error } = await supabaseClient
                    .from('dyfc_orders')
                    .select('*')
                    .order('create_at', { ascending: false });  // ← 改这里

                if (error) {
                    tbody.innerHTML = `<tr><td colspan="6" class="empty-tip">加载失败：${error.message}</td></tr>`;
                    return;
                }
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-tip">暂无订单</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(o => {
                    const tr = document.createElement('tr');
                    const time = o.create_at ? new Date(o.create_at).toLocaleString() : '-'; // ← 改这里
                    tr.innerHTML = `
                        <td>${o.ticket || '-'}</td>
                        <td>${o.name || '-'}</td>
                        <td>${o.order_no || '-'}</td>
                        <td>${o.station || '-'}</td>
                        <td>${o.username || '-'}</td>
                        <td>${time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-tip">异常：${err.message}</td></tr>`;
            }
        }

        async function showNoticeManage() {
            hideAll();
            document.getElementById('adminPage').style.display = 'block';
            document.getElementById('noticeManagePage').style.display = 'block';
            await renderNoticeManage();
        }

        function backToAdmin() { hideAll(); document.getElementById('adminPage').style.display = 'block'; }

        // ============================================================
        // 7. 显式暴露所有需要给 HTML 调用的函数
        // ============================================================
        window.showHome = showHome;
        window.showLogin = showLogin;
        window.showRegister = showRegister;
        window.login = login;
        window.register = register;
        window.logout = logout;
        window.showStationPage = showStationPage;
        window.showTicketPage = showTicketPage;
        window.showBuyPage = showBuyPage;
        window.submitOrder = submitOrder;
        window.showMyOrder = showMyOrder;
        window.backToUser = backToUser;
        window.showOrderList = showOrderList;
        window.showNoticeManage = showNoticeManage;
        window.backToAdmin = backToAdmin;
        window.addNotice = addNotice;
        window.editNotice = editNotice;
        window.deleteNotice = deleteNotice;
        window.renderHomeNotice = renderHomeNotice;
        window.renderUserNotice = renderUserNotice;
        window.renderNoticeManage = renderNoticeManage;
        window.showToast = showToast;
    </script>
</body>
</html>
