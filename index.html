<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial‑scale=1.0">
    <title>电摇飞车票务系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f4f7fa;padding:20px;max-width:900px;margin:0 auto;}
        .container{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 8px #00000018;}
        h1{text-align:center;color:#222;margin-bottom:24px;font-size:26px;}
        .btn{padding:10px 18px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer;margin:6px 4px;font-size:15px;}
        .btn:hover{opacity:0.9}
        .btn-danger{background:#dc2626}
        .btn-sm{padding:6px 10px;font-size:13px;}
        .box{margin:16px 0;}
        input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:15px;}
        textarea{width:100%;min-height:80px;padding:10px;border:1px solid #ccc;border-radius:6px;margin:8px 0;}
        .notice-item{padding:10px;border-bottom:1px solid #eee;}
        .notice-item-manage{padding:12px;border:1px solid #eee;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
        table{width:100%;border-collapse:collapse;margin:12px 0;}
        td,th{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
        .empty-tip{color:#888}
        .error-text{color:red;margin:8px 0;}
        .nav-bar{text-align:center;margin-bottom:20px;}
    </style>
</head>
<body>
<div class="container">
    <h1>电摇飞车票务系统</h1>
    <div class="nav-bar">
        <button class="btn" onclick="showHome()">首页</button>
        <button class="btn" onclick="showLogin()">登录</button>
        <button class="btn" onclick="showRegister()">注册</button>
    </div>

    <!--首页-->
    <div id="home">
        <h3>系统公告</h3>
        <div id="homeNoticeList"></div>
    </div>

    <!--登录页-->
    <div id="login" style="display:none">
        <h3>用户登录</h3>
        <input type="text" id="loginUsername" placeholder="用户名">
        <input type="password" id="loginPwd" placeholder="密码">
        <div class="error-text" id="loginError"></div>
        <button class="btn" onclick="login()">登录</button>
    </div>

    <!--注册页-->
    <div id="register" style="display:none">
        <h3>用户注册</h3>
        <input type="text" id="regUsername" placeholder="用户名">
        <input type="password" id="regPwd" placeholder="密码(最少6位)">
        <div class="error-text" id="regError"></div>
        <button class="btn" onclick="register()">注册</button>
    </div>

    <!--玩家中心-->
    <div id="userPage" style="display:none">
        <h3>🚗玩家中心</h3>
        <button class="btn" onclick="showStationPage()">站点信息</button>
        <button class="btn" onclick="showTicketPage()">在线购票</button>
        <button class="btn" onclick="showMyOrder()">我的订单</button>
        <button class="btn btn-danger" onclick="logout()">退出登录</button>
        <div id="userNoticeList" style="margin:16px 0;"></div>

        <div id="stationPage" style="display:none" class="box">
            <h4>站点列表</h4>
            <p>公园路小学(东)</p>
        </div>

        <div id="ticketPage" style="display:none" class="box">
            <h4>选择车票</h4>
            <button class="btn" onclick="showBuyPage('单程票')">单程票</button>
            <button class="btn" onclick="showBuyPage('往返票')">往返票</button>
        </div>

        <div id="buyPage" style="display:none" class="box">
            <h4>购买 <span id="selectedTicket"></span></h4>
            <input type="text" id="buyerName" placeholder="乘车人姓名">
            <button class="btn" onclick="submitOrder()">提交订单</button>
            <button class="btn" onclick="backToUser()">返回</button>
        </div>

        <div id="orderSuccess" style="display:none" class="box">
            <h4>购票成功！</h4>
            <p>您的订单号：<strong id="orderNo"></strong></p>
            <button class="btn" onclick="backToUser()">返回玩家中心</button>
        </div>

        <div id="myOrderPage" style="display:none" class="box">
            <h4>我的订单</h4>
            <table>
                <thead>
                    <tr><th>车票</th><th>学号</th><th>订单号</th><th>站点</th><th>时间</th></tr>
                </thead>
                <tbody id="myOrderBody"></tbody>
            </table>
            <button class="btn" onclick="backToUser()">返回</button>
        </div>
    </div>

    <!--管理员后台-->
    <div id="adminPage" style="display:none">
        <h3>👑管理员控制面板</h3>
        <button class="btn" onclick="showOrderList()">预定管理‑订单列表</button>
        <button class="btn" onclick="showNoticeManage()">公告管理</button>
        <button class="btn btn-danger" onclick="logout()">退出登录</button>

        <div id="orderListPage" style="display:none" class="box">
            <h4>全部订单（管理员可见）</h4>
            <table>
                <thead>
                    <tr><th>车票</th><th>姓名</th><th>订单号</th><th>站点</th><th>下单用户</th><th>时间</th></tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
            </table>
            <button class="btn" onclick="backToAdmin()">返回</button>
        </div>

        <div id="noticeManagePage" style="display:none" class="box">
            <h4>公告管理</h4>
            <textarea id="newNoticeContent" placeholder="输入新公告内容"></textarea>
            <button class="btn" onclick="addNotice()">发布公告</button>
            <div id="noticeManageList"></div>
            <button class="btn" onclick="backToAdmin()">返回</button>
        </div>
    </div>
</div>

<script>
// ============ Supabase配置 ============
const SUPABASE_URL = "https://tdozxaazdiuauncmhvuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_Pstnb3KOIrdvXtwKiT3rPg_X7-9TL1U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTicketType = "";
let currentUsername = "";
let currentRole = "user";

//SHA256密码加密函数
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
}

window.onload = async function(){
    await checkSession();
    await renderHomeNotice();
}

async function checkSession(){
    const raw = localStorage.getItem("dyfc_user");
    if(!raw) return;
    const userObj = JSON.parse(raw);
    currentUsername = userObj.username;
    currentRole = userObj.role;
    hideAll();
    if(currentRole === "admin"){
        document.getElementById("adminPage").style.display="block";
    }else{
        document.getElementById("userPage").style.display="block";
        await renderUserNotice();
    }
}

function hideAll(){
    document.getElementById("home").style.display = "none";
    document.getElementById("login").style.display = "none";
    document.getElementById("register").style.display = "none";
    document.getElementById("userPage").style.display = "none";
    document.getElementById("stationPage").style.display = "none";
    document.getElementById("ticketPage").style.display = "none";
    document.getElementById("buyPage").style.display = "none";
    document.getElementById("orderSuccess").style.display = "none";
    document.getElementById("myOrderPage").style.display = "none";
    document.getElementById("adminPage").style.display = "none";
    document.getElementById("orderListPage").style.display = "none";
    document.getElementById("noticeManagePage").style.display = "none";
    document.getElementById("loginError").innerText = "";
    document.getElementById("regError").innerText = "";
}

function showHome(){hideAll();document.getElementById("home").style.display="block";renderHomeNotice();}
function showLogin(){hideAll();document.getElementById("login").style.display="block";}
function showRegister(){hideAll();document.getElementById("register").style.display="block";}

async function renderHomeNotice(){
    const {data,error} = await supabaseClient.from("dyfc_notices").select("*").order("create_at",{ascending:false});
    const box = document.getElementById("homeNoticeList");
    if(error){alert("读取公告失败："+error.message);return;}
    box.innerHTML = "";
    if(!data||data.length===0){box.innerHTML="<div class='notice-item'>暂无公告</div>";return;}
    data.forEach(item=>{
        const div = document.createElement("div");
        div.className="notice-item";
        div.innerText="• "+item.content;
        box.appendChild(div);
    })
}

async function renderUserNotice(){
    const {data,error} = await supabaseClient.from("dyfc_notices").select("*").order("create_at",{ascending:false});
    const box = document.getElementById("userNoticeList");
    if(error){alert("读取公告失败："+error.message);return;}
    box.innerHTML="";
    if(!data||data.length===0){box.innerHTML="<div class='notice-item'>暂无公告</div>";return;}
    data.forEach(item=>{
        const div = document.createElement("div");
        div.className="notice-item";
        div.innerText="• "+item.content;
        box.appendChild(div);
    })
}

//注册
async function register(){
    const username = document.getElementById("regUsername").value.trim();
    const pwd = document.getElementById("regPwd").value.trim();
    const errTip = document.getElementById("regError");
    if(!username||!pwd){errTip.innerText="用户名和密码不能为空";return;}
    if(pwd.length<6){errTip.innerText="密码至少6位";return;}
    const hashPwd = await sha256(pwd);
    const {error} = await supabaseClient.from("app_users").insert([{username:username,password_hash:hashPwd,role:"user"}]);
    if(error){
        if(error.code==='23505'){
            errTip.innerText="该用户名已被占用";
        }else{
            errTip.innerText=error.message;
        }
        return;
    }
    alert("注册成功！请登录");
    showLogin();
}

//登录
async function login(){
    const username = document.getElementById("loginUsername").value.trim();
    const pwd = document.getElementById("loginPwd").value;
    const errTip = document.getElementById("loginError");
    if(!username||!pwd){errTip.innerText="填写用户名密码";return;}
    const hashPwd = await sha256(pwd);
    const {data,error} = await supabaseClient.from("app_users").select("username,role").eq("username",username).eq("password_hash",hashPwd).single();
    if(error||!data){
        errTip.innerText="用户名或者密码错误";
        return;
    }
    currentUsername = data.username;
    currentRole = data.role;
    localStorage.setItem("dyfc_user",JSON.stringify(data));
    hideAll();
    if(currentRole==="admin"){
        document.getElementById("adminPage").style.display="block";
    }else{
        document.getElementById("userPage").style.display="block";
        await renderUserNotice();
    }
}

async function logout(){
    localStorage.removeItem("dyfc_user");
    currentUsername="";
    currentRole="user";
    showHome();
}

function showStationPage(){hideAll();document.getElementById("userPage").style.display="block";document.getElementById("stationPage").style.display="block";}
function showTicketPage(){hideAll();document.getElementById("userPage").style.display="block";document.getElementById("ticketPage").style.display="block";}
function showBuyPage(ticket){
    currentTicketType = ticket;
    document.getElementById("selectedTicket").innerText = ticket;
    hideAll();
    document.getElementById("userPage").style.display="block";
    document.getElementById("buyPage").style.display="block";
}

//提交订单（已修复卡死问题）
async function submitOrder(){
    const buyerName = document.getElementById("buyerName").value.trim();
    if(!buyerName){alert("请填写学号");return;}
    const orderNo = "DYFC"+Date.now().toString().slice(-6)+Math.floor(Math.random()*1000).toString().padStart(3,"0");
    const payload = {
        ticket:currentTicketType,
        name:buyerName,
        station:"公园路小学(东)",
        order_no:orderNo,
        username:currentUsername
    };
    const {error} = await supabaseClient.from("dyfc_orders").insert([payload]);
    if(error){alert("下单失败："+error.message);return;}
    document.getElementById("orderNo").innerText=orderNo;
    hideAll();
    document.getElementById("userPage").style.display="block";
    document.getElementById("orderSuccess").style.display="block";
    document.getElementById("buyerName").value="";
}

//普通用户：只读取自己的订单
async function showMyOrder(){
    hideAll();
    document.getElementById("userPage").style.display="block";
    document.getElementById("myOrderPage").style.display="block";
    const tbody = document.getElementById("myOrderBody");
    const {data,error} = await supabaseClient.from("dyfc_orders").select("*").eq("username",currentUsername).order("create_at",{ascending:false});
    if(error){alert("加载订单失败："+error.message);return;}
    if(!data||data.length===0){
        tbody.innerHTML="<tr><td colspan='5' class='empty-tip'>暂无购票记录</td>";
        return;
    }
    tbody.innerHTML="";
    data.forEach(o=>{
        const tr = document.createElement("tr");
        tr.innerHTML=`
        <td>${o.ticket}</td>
        <td>${o.name}</td>
        <td>${o.order_no}</td>
        <td>${o.station}</td>
        <td>${new Date(o.create_at).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    })
}

function backToUser(){hideAll();document.getElementById("userPage").style.display="block";renderUserNotice();}

//管理员读取全部订单
async function showOrderList(){
    hideAll();
    document.getElementById("adminPage").style.display="block";
    document.getElementById("orderListPage").style.display="block";
    const tbody = document.getElementById("orderTableBody");
    const {data,error} = await supabaseClient.from("dyfc_orders").select("*").order("create_at",{ascending:false});
    if(error){alert("加载订单失败："+error.message);return;}
    if(!data||data.length===0){
        tbody.innerHTML="<tr><td colspan='6' class='empty-tip'>暂无订单</td>";
        return;
    }
    tbody.innerHTML="";
    data.forEach(o=>{
        const tr = document.createElement("tr");
        tr.innerHTML=`
        <td>${o.ticket}</td>
        <td>${o.name}</td>
        <td>${o.order_no}</td>
        <td>${o.station}</td>
        <td>${o.username||"-"}</td>
        <td>${new Date(o.create_at).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    })
}

async function showNoticeManage(){
    hideAll();
    document.getElementById("adminPage").style.display="block";
    document.getElementById("noticeManagePage").style.display="block";
    await renderNoticeManage();
}

async function renderNoticeManage(){
    const box = document.getElementById("noticeManageList");
    box.innerHTML="";
    const {data,error} = await supabaseClient.from("dyfc_notices").select("*").order("create_at",{ascending:false});
    if(error){alert("公告加载失败："+error.message);return;}
    if(!data) return;
    data.forEach(item=>{
        const div=document.createElement("div");
        div.className="notice-item-manage";
        div.innerHTML=`
        <div class="notice-content">${item.content}</div>
        <div class="notice-actions">
            <button class="btn btn-sm" onclick="editNotice(${item.id},'${item.content.replaceAll("'","\\'")}')">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteNotice(${item.id})">删除</button>
        </div>
        `;
        box.appendChild(div);
    })
}

async function addNotice(){
    const inp = document.getElementById("newNoticeContent");
    const c = inp.value.trim();
    if(!c){alert("填写公告");return;}
    const {error} = await supabaseClient.from("dyfc_notices").insert([{content:c}]);
    if(error){alert("发布公告失败："+error.message);return;}
    inp.value="";
    await renderNoticeManage();
    await renderHomeNotice();
}

async function editNotice(id,oldText){
    const newVal = prompt("编辑公告",oldText);
    if(newVal===null||!newVal.trim()) return;
    const {error} = await supabaseClient.from("dyfc_notices").update({content:newVal.trim()}).eq("id",id);
    if(error){alert(error.message);return;}
    await renderNoticeManage();
    await renderHomeNotice();
}

async function deleteNotice(id){
    if(!confirm("确定删除？")) return;
    const {error} = await supabaseClient.from("dyfc_notices").delete().eq("id",id);
    if(error){alert(error.message);return;}
    await renderNoticeManage();
    await renderHomeNotice();
}

function backToAdmin(){hideAll();document.getElementById("adminPage").style.display="block";}
</script>
</body>
</html>
